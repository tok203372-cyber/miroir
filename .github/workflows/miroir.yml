# Miroir : fabrique les deux applications de partage d'écran (téléphone + montre Wear OS).
#
# Le code complet de Miroir est contenu plus bas (MIROIR_PROJET, compressé). GitHub le compile
# dans son cloud et propose les deux APK à télécharger :
#   onglet Actions > la compilation terminée (coche verte) > en bas « Artifacts » > Miroir-APK
#
# Lancement : à chaque envoi (commit) de ce fichier, ou bouton « Run workflow » dans l'onglet Actions.

name: Compiler Miroir

on:
  workflow_dispatch:
  push:

concurrency:
  group: miroir
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK téléphone + montre
    runs-on: ubuntu-24.04
    timeout-minutes: 45

