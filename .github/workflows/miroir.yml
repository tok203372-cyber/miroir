      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer la plateforme Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Installer Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Compiler les applications (téléphone et montre)
        shell: bash
        working-directory: miroir
        run: gradle --no-daemon --stacktrace :telephone:assembleRelease :montre:assembleRelease

      - name: Rassembler les APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sortie
          cp miroir/telephone/build/outputs/apk/release/telephone-release.apk sortie/Miroir-telephone.apk
          cp miroir/montre/build/outputs/apk/release/montre-release.apk sortie/Miroir-montre.apk
          ls -la sortie

      - name: Publier les APK
        uses: actions/upload-artifact@v7
        with:
          name: Miroir-APK
          path: sortie/
          if-no-files-found: error
